AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Udacity Project - Enterprise Multi-Agent Architecture with Amazon Bedrock AgentCore
  Infrastructure for DynamoDB, S3, S3 Vectors, IAM roles, and CloudWatch.

Parameters:
  ProjectName:
    Type: String
    Default: udacity-agentcore
Resources:

  # ─────────────────────────────────────────────
  # DYNAMODB - Application Data
  # ─────────────────────────────────────────────

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: order_id
          AttributeType: S
      # Composite key: every order lookup needs both customer_id (partition
      # key) and order_id (sort key).
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
        - AttributeName: order_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-customers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH

  # Shared workflow state table.
  # Each customer session gets one record here.
  # Agents read and write to it as the orchestrator routes through them.
  # version attribute enables optimistic locking (conditional writes).
  WorkflowStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-workflow-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─────────────────────────────────────────────
  # S3 - Policy Documents (KB data source + deployment artifacts)
  # ─────────────────────────────────────────────

  PolicyDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - '${ProjectName}-policy-docs-${AWS::AccountId}-${ShortUUID}'
        - ShortUUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ─────────────────────────────────────────────
  # S3 VECTORS - Knowledge Base backing store (Task 5)
  # ─────────────────────────────────────────────
  # S3 Vectors is a separate service from general-purpose S3. A Bedrock
  # Knowledge Base backed by S3 Vectors needs a *vector bucket* plus one
  # *vector index* per Knowledge Base. All three are created here for selection
  # in the Knowledge Base console wizard.
  #
  # Index settings match the Titan Embed Text v2 defaults used by the KBs:
  #   dimension 1024, cosine distance, AMAZON_BEDROCK_TEXT non-filterable
  #   (the chunk text is stored as metadata and must not be indexed).

  VectorStoreBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub
        - '${ProjectName}-vectors-${AWS::AccountId}-${ShortUUID}'
        - ShortUUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]

  ReturnsVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorStoreBucket.VectorBucketArn
      IndexName: returns-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT

  ShippingVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorStoreBucket.VectorBucketArn
      IndexName: shipping-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT

  WarrantyVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorStoreBucket.VectorBucketArn
      IndexName: warranty-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT

  # ─────────────────────────────────────────────
  # IAM - Role for AgentCore
  # ─────────────────────────────────────────────
  # Assumed by the AgentCore Runtime (and usable by Bedrock). The deployed
  # runtime imports the same config.py used locally, so it needs
  # to read CloudFormation exports and download the code package from S3.

  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-agentcore-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
                - bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentCoreProjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Bedrock model invocation + guardrail enforcement
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                  - bedrock:GetGuardrail
                Resource: "*"

              # Bedrock Knowledge Base retrieval
              # Used by the three policy retriever agents
              # (ReturnsPolicyRetrieverAgent, ShippingPolicyRetrieverAgent,
              #  WarrantyPolicyRetrieverAgent) to call bedrock-agent-runtime.retrieve()
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:GetKnowledgeBase
                Resource: "*"

              # CloudFormation exports + caller identity - read by config.py
              # inside the deployed runtime (the same code path used locally)
              - Effect: Allow
                Action:
                  - cloudformation:ListExports
                  - cloudformation:DescribeStacks
                  - sts:GetCallerIdentity
                Resource: "*"

              # CloudWatch Logs - agent execution logs (Task 6: Observability)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:CreateLogDelivery
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

              # X-Ray - distributed tracing (Task 6: Observability)
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

              # AgentCore Memory - event storage for session summaries (Task 4)
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource: "*"

              # DynamoDB - all tables the agents read/write
              # OrdersTable:        InventoryAgent (read), RefundAgent (write)
              # CustomersTable:     InventoryAgent (read), RefundAgent (read fallback)
              # WorkflowStateTable: OrchestratorAgent (read + write, optimistic lock)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !GetAtt CustomersTable.Arn
                  - !GetAtt WorkflowStateTable.Arn

              # S3 - policy documents bucket
              # Used by seed_data.py to upload docs and by Bedrock KB sync.
              # (The AgentCore CLI stores the runtime code package in the CDK
              # assets bucket, not here.)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PolicyDocumentsBucket.Arn
                  - !Sub ${PolicyDocumentsBucket.Arn}/*

              # S3 Vectors - backing store for Bedrock Knowledge Bases (Task 5)
              - Effect: Allow
                Action:
                  - s3vectors:*
                Resource: "*"

  # ─────────────────────────────────────────────
  # CLOUDWATCH - Log Groups
  # ─────────────────────────────────────────────

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/bedrock/agentcore/${ProjectName}
      RetentionInDays: 14


# ─────────────────────────────────────────────
# OUTPUTS - Exported for config.py to read
# ─────────────────────────────────────────────
Outputs:

  OrdersTableName:
    Value: !Ref OrdersTable
    Export:
      Name: !Sub ${ProjectName}-OrdersTable

  CustomersTableName:
    Value: !Ref CustomersTable
    Export:
      Name: !Sub ${ProjectName}-CustomersTable

  WorkflowStateTableName:
    Value: !Ref WorkflowStateTable
    Export:
      Name: !Sub ${ProjectName}-WorkflowStateTable

  PolicyDocumentsBucketName:
    Value: !Ref PolicyDocumentsBucket
    Export:
      Name: !Sub ${ProjectName}-PolicyBucket

  # S3 Vectors bucket *name* (select this in the Knowledge Base wizard)
  VectorStoreBucketName:
    Value: !Sub
      - '${ProjectName}-vectors-${AWS::AccountId}-${ShortUUID}'
      - ShortUUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
    Export:
      Name: !Sub ${ProjectName}-VectorBucket

  VectorStoreBucketArn:
    Value: !GetAtt VectorStoreBucket.VectorBucketArn
    Export:
      Name: !Sub ${ProjectName}-VectorBucketArn

  # One vector index per Knowledge Base (select the matching one per KB)
  ReturnsVectorIndexName:
    Value: returns-policy-index
    Export:
      Name: !Sub ${ProjectName}-ReturnsVectorIndex

  ShippingVectorIndexName:
    Value: shipping-policy-index
    Export:
      Name: !Sub ${ProjectName}-ShippingVectorIndex

  WarrantyVectorIndexName:
    Value: warranty-policy-index
    Export:
      Name: !Sub ${ProjectName}-WarrantyVectorIndex

  AgentCoreRoleArn:
    Value: !GetAtt AgentCoreExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-AgentCoreRoleArn

  AgentLogGroupName:
    Value: !Ref AgentLogGroup
    Export:
      Name: !Sub ${ProjectName}-AgentLogGroup
